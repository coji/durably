packages:
  - 'packages/*'
  - 'examples/*'
  - 'website'

update:
  githubActions: true

injectWorkspacePackages: true
syncInjectedDepsAfterScripts:
  - build

# Remove targeted overrides when the parents ship compatible fixed dependencies.
overrides:
  # The dialect's owned client is covered by libSQL integration/stress tests.
  '@libsql/kysely-libsql>@libsql/client': 0.18.0
  # Config extraction uses the same Ajv 8 compile/validate API; deployment builds pass.
  '@vercel/static-config>ajv': 8.20.0
  # Express 4 and body-parser 1 pin older qs patches; keep their compatible fixes.
  'express@4>qs': 6.16.1
  'body-parser@1>qs': 6.16.1
  # The font parser's 0.7 range needs the backported ZIP64 parsing fix.
  '@shuding/opentype.js>fflate': 0.7.5
  'satori>fflate': 0.7.5

allowBuilds:
  better-sqlite3: true
  cpu-features: true
  esbuild: true
  lefthook: true
  protobufjs: true
  ssh2: true
